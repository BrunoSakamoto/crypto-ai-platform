services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion-binance:
    build: ./services/ingestion-binance
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  ingestion-coingecko:
    build: ./services/ingestion-coingecko
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  processor:
    build: ./services/processor
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgresql://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-crypto_platform}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  rag-engine:
    build: ./services/rag-engine
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgresql://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-crypto_platform}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-crypto_platform}
      JWT_SECRET: ${JWT_SECRET:-change_me_too}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
