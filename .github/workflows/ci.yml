name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Lint
        run: |
          pip install ruff
          ruff check services/ tests/

  build-images:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [ingestion-binance, ingestion-coingecko, processor, rag-engine, api]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build -t crypto-ai-platform/${{ matrix.service }}:ci ./services/${{ matrix.service }}
